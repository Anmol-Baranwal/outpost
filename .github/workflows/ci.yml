name: CI

on:
    # `main` is the known-good line and deploys production; `staging` is the
    # integration line and deploys staging. Railway's deploy triggers wait for a CI
    # check suite on the pushed commit, so both branches must run CI here — dropping
    # one would leave its deploys waiting on a check that never arrives.
    pull_request:
        branches: [main, staging]
    push:
        branches: [main, staging]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-typecheck-test:
        name: Lint, Typecheck & Test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm db:generate

            - name: Verify Prisma schema and migrations
              env:
                  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
              run: |
                  pnpm --filter @copilotkit/outpost exec prisma validate --schema db/prisma/schema.prisma
                  # Ensure migration directory exists with at least one migration
                  test -f packages/outpost/db/prisma/migrations/migration_lock.toml
                  test -d packages/outpost/db/prisma/migrations/0001_init

            - name: Build
              run: pnpm build

            # Lint is NOT run here yet, even though this job is named "Lint, Typecheck &
            # Test" and branch protection requires that check. Enabling it needs the
            # ESLint 9 flat-config migration (this repo still uses .eslintrc.cjs, and
            # ESLint 9 will not read it without ESLINT_USE_FLAT_CONFIG=false, which does
            # not survive turbo's environment sanitization). That migration also changes
            # lint resolution for editors, per-package invocations, and apps/web's
            # separate Next config, so it is being landed as its own PR where those
            # effects can be verified in isolation rather than bundled here.

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

    # Railway auto-deploys on push to main via GitHub integration.
    # No explicit deploy step needed — Railway watches the repo directly.
    #
    # IMPORTANT: Configure branch protection on `main` to require the
    # "Lint, Typecheck & Test" check to pass before merging. This ensures
    # Railway only auto-deploys code that has passed CI.
    #
    # To switch to CLI-driven deploys instead, uncomment the job below
    # and set the RAILWAY_TOKEN repository secret.
    #
    # deploy:
    #     name: Deploy to Railway
    #     runs-on: ubuntu-latest
    #     needs: lint-typecheck-test
    #     if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    #
    #     steps:
    #         - name: Checkout
    #           uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    #
    #         - name: Install Railway CLI
    #           run: npm i -g @railway/cli
    #
    #         - name: Deploy to Railway
    #           env:
    #               RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    #           run: railway up --detach
