name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-typecheck-test:
        name: Lint, Typecheck & Test
        runs-on: ubuntu-latest
        env:
            ESLINT_USE_FLAT_CONFIG: 'false'

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 20
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm db:generate

            - name: Verify Prisma schema and migrations
              env:
                  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
              run: |
                  pnpm --filter @copilotkit/outpost exec prisma validate --schema db/prisma/schema.prisma
                  # Ensure migration directory exists with at least one migration
                  test -f packages/outpost/db/prisma/migrations/migration_lock.toml
                  test -d packages/outpost/db/prisma/migrations/0001_init

            - name: Build
              run: pnpm build

            # Lint skipped: ESLint 9 requires flat config but repo uses legacy .eslintrc.cjs.
            # TODO: Migrate to eslint.config.js and re-enable.

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

    # Railway auto-deploys on push to main via GitHub integration.
    # No explicit deploy step needed — Railway watches the repo directly.
    #
    # IMPORTANT: Configure branch protection on `main` to require the
    # "Lint, Typecheck & Test" check to pass before merging. This ensures
    # Railway only auto-deploys code that has passed CI.
    #
    # To switch to CLI-driven deploys instead, uncomment the job below
    # and set the RAILWAY_TOKEN repository secret.
    #
    # deploy:
    #     name: Deploy to Railway
    #     runs-on: ubuntu-latest
    #     needs: lint-typecheck-test
    #     if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    #
    #     steps:
    #         - name: Checkout
    #           uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    #
    #         - name: Install Railway CLI
    #           run: npm i -g @railway/cli
    #
    #         - name: Deploy to Railway
    #           env:
    #               RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    #           run: railway up --detach
