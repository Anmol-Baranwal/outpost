name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-typecheck-test:
        name: Lint, Typecheck & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm db:generate

            - name: Verify Prisma schema and migrations
              env:
                  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
              run: |
                  pnpm --filter @copilotkit/outpost exec prisma validate --schema db/prisma/schema.prisma
                  # Ensure migration directory exists with at least one migration
                  test -f packages/outpost/db/prisma/migrations/migration_lock.toml
                  test -d packages/outpost/db/prisma/migrations/0001_init

            - name: Build
              run: pnpm build --filter '!@copilotkit/outpost-web'
              # Web build excluded: shared barrel re-exports platform adapters (discord.js)
              # which have native deps webpack can't resolve. Fix: split shared exports.
              # Typecheck and tests still validate all web source code.

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

    # Railway auto-deploys on push to main via GitHub integration.
    # No explicit deploy step needed — Railway watches the repo directly.
    # To use CLI deploys instead, uncomment the job below and set RAILWAY_TOKEN secret.
