# Railway config — outpost-discord-bot (background worker, no public port)
# In Railway: set this service's "Config file path" to apps/discord-bot/railway.toml
# and leave Root Directory empty (build context must be the repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/discord-bot/Dockerfile"

[deploy]
restartPolicyType = "ALWAYS"
