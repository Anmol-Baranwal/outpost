<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a2e" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Orange accent line at top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent-grad)"/>

  <!-- Mountain emoji -->
  <text x="600" y="220" text-anchor="middle" font-size="100">&#127956;&#65039;</text>

  <!-- $ outpost -->
  <text x="600" y="340" text-anchor="middle" font-family="monospace" font-weight="700" font-size="72" fill="#e8e8f0">
    <tspan fill="#f97316">$</tspan> outpost
  </text>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#8888a0">
    AI-powered support operations platform
  </text>

  <!-- Bottom bar with CopilotKit -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#555570">
    by CopilotKit
  </text>

  <!-- Corner accents -->
  <rect x="40" y="480" width="60" height="3" rx="1.5" fill="#f97316" opacity="0.4"/>
  <rect x="1100" y="480" width="60" height="3" rx="1.5" fill="#f97316" opacity="0.4"/>
</svg>
