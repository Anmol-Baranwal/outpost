<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Amber accent line near top -->
  <rect x="0" y="0" width="1200" height="2" fill="#ffaa00"/>

  <!-- Two peaks: same slope angles, left shorter, right taller -->
  <polyline
    points="510,230 551,155 575,200 625,110 690,230"
    fill="none"
    stroke="#ffaa00"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- "outpost" text -->
  <text x="600" y="340" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="48" fill="#ffffff">outpost</text>

  <!-- Tagline -->
  <text x="600" y="385" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8888a0">AI-powered support operations platform</text>

  <!-- Bottom left: $ outpost -->
  <text x="60" y="590" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="18" fill="#555570">$ outpost</text>

  <!-- Bottom right: domain -->
  <text x="1140" y="590" text-anchor="end" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="18" fill="#555570">outpost.copilotkit.dev</text>
</svg>
