# Railway config — outpost-github-app (webhook receiver, public port)
# In Railway: set this service's "Config file path" to apps/github-app/railway.toml
# and leave Root Directory empty (build context must be the repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/github-app/Dockerfile"

[deploy]
restartPolicyType = "ALWAYS"
healthcheckPath = "/health"
