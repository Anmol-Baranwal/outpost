# Railway config — outpost-linear-sync (webhook receiver, public port)
# In Railway: set this service's "Config file path" to apps/linear-sync/railway.toml
# and leave Root Directory empty (build context must be the repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/linear-sync/Dockerfile"

[deploy]
restartPolicyType = "ALWAYS"
healthcheckPath = "/health"
