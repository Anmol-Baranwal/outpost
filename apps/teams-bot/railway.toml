# Railway config — outpost-teams-bot (webhook receiver, public port)
# In Railway: set this service's "Config file path" to apps/teams-bot/railway.toml
# and leave Root Directory empty (build context must be the repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/teams-bot/Dockerfile"

[deploy]
restartPolicyType = "ALWAYS"
healthcheckPath = "/health"
