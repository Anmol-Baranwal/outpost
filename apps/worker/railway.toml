# Railway config — outpost-worker (background job processor)
# In Railway: set this service's "Config file path" to apps/worker/railway.toml
# and leave Root Directory empty (build context must be the repo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/worker/Dockerfile"

[deploy]
restartPolicyType = "ALWAYS"
healthcheckPath = "/health"
