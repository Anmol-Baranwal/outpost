version: '3.8'

services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: outpost-postgres
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: outpost
            POSTGRES_PASSWORD: outpost
            POSTGRES_DB: outpost
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U outpost']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
