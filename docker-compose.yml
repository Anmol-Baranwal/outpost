services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: outpost-postgres
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: outpost
            POSTGRES_PASSWORD: outpost
            POSTGRES_DB: outpost
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U outpost']
            interval: 5s
            timeout: 5s
            retries: 5

    pathfinder:
        image: ghcr.io/copilotkit/pathfinder:latest
        container_name: outpost-pathfinder
        ports:
            - '8787:8787'
        environment:
            PORT: 8787
            DATABASE_URL: postgresql://outpost:outpost@postgres:5432/outpost
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data:
