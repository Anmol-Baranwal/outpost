# Railway deployment configuration for Outpost
# https://docs.railway.com/reference/config-as-code

# ── Next.js web application ──────────────────────────────────────────────────
[services.web]
name = "outpost-web"
dockerfile = "apps/web/Dockerfile"
healthcheck = "/api/health"
restartPolicy = "always"

[services.web.deploy]
startCommand = ""
region = "us-west1"

# ── Discord bot (background worker, no public port) ─────────────────────────
[services.discord-bot]
name = "outpost-discord-bot"
dockerfile = "apps/discord-bot/Dockerfile"
restartPolicy = "always"

[services.discord-bot.deploy]
startCommand = ""
region = "us-west1"

# ── GitHub app (webhook receiver, needs public port) ─────────────────────────
[services.github-app]
name = "outpost-github-app"
dockerfile = "apps/github-app/Dockerfile"
healthcheck = "/health"
restartPolicy = "always"

[services.github-app.deploy]
startCommand = ""
region = "us-west1"

# ── Slack bot (background worker, no public port) ──────────────────────────
[services.slack-bot]
name = "outpost-slack-bot"
dockerfile = "apps/slack-bot/Dockerfile"
restartPolicy = "always"

[services.slack-bot.deploy]
startCommand = ""
region = "us-west1"

# ── Teams bot (webhook receiver, needs public port) ─────────────────────────
[services.teams-bot]
name = "outpost-teams-bot"
dockerfile = "apps/teams-bot/Dockerfile"
healthcheck = "/health"
restartPolicy = "always"

[services.teams-bot.deploy]
startCommand = ""
region = "us-west1"

# ── Linear sync (webhook receiver, needs public port) ──────────────────────
[services.linear-sync]
name = "outpost-linear-sync"
dockerfile = "apps/linear-sync/Dockerfile"
healthcheck = "/health"
restartPolicy = "always"

[services.linear-sync.deploy]
startCommand = ""
region = "us-west1"
